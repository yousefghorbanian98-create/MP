name: mp_client
description: Muscle Paradise — اپ عضو (موبایل/کیوسک/PWA)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  intl: any  # با flutter_localizations هماهنگ می‌شود (پین دقیق SDK)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
