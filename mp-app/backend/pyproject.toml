[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-backend"
version = "0.1.0"
description = "Muscle Paradise — FastAPI backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "passlib>=1.7",
    "pyotp>=2.9",
    "casbin>=1.30",
    "structlog>=24.1",
    "APScheduler>=3.10",
    "slowapi>=0.1.9",
    "pynacl>=1.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "bandit>=1.7,<2",
    "pip-audit>=2.7",
    "faker>=24.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*", "modules*", "db*", "security*", "jobs*", "cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/tests/*"]
