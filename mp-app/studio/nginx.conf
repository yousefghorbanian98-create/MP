# استودیو — SPA + پراکسی /api به بک‌اند
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rendered by the official Nginx entrypoint from STUDIO_TRUSTED_PROXY.
    # Only the configured upstream proxy may supply X-Forwarded-For; unknown
    # peers are replaced with their TCP address before the backend hop.
    set_real_ip_from ${STUDIO_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → سرویس backend در شبکهٔ compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # real_ip rewrites remote_addr only for STUDIO_TRUSTED_PROXY; send that
        # sanitized client address as a single hop to Uvicorn (never raw XFF).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
