<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">MP Knowledge Atlas</title>
  <desc id="desc">A dark emerald-and-gold architecture map linking source code, architecture, decisions and AI session handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a24" />
      <stop offset="0.58" stop-color="#0b0f14" />
      <stop offset="1" stop-color="#091813" />
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e6a0" />
      <stop offset="1" stop-color="#00b86a" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe89a" />
      <stop offset="1" stop-color="#ffd700" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00b86a" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00b86a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b4c7d8" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="34" fill="url(#bg)" />
  <rect width="1600" height="500" rx="34" fill="url(#grid)" />
  <rect width="1600" height="500" rx="34" fill="url(#glow)" />
  <path d="M0 418C300 370 500 465 780 414S1260 358 1600 405" fill="none" stroke="#00b86a" stroke-opacity="0.13" stroke-width="1.5" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="100" y="112" fill="#74e5b7" font-size="17" font-weight="700" letter-spacing="5">MUSCLE PARADISE  /  ENGINEERING HANDBOOK</text>
    <text x="96" y="222" fill="#f4f7f9" font-size="66" font-weight="800" letter-spacing="-2">KNOWLEDGE ATLAS</text>
    <rect x="101" y="253" width="132" height="5" rx="3" fill="url(#gold)" />
    <text x="101" y="310" fill="#c2cbd2" font-size="23" font-weight="500">Architecture  ·  Decisions  ·  AI Session Handoff</text>
    <text x="101" y="365" fill="#8998a5" font-size="16" font-weight="600" letter-spacing="1.6">ONE GIT-TRACKED MAP  ·  MANY SESSIONS  ·  NO GUESSWORK</text>
  </g>

  <g transform="translate(900 76)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M82 111H197M283 111H398M484 111H599M82 111V265H197M283 265H398M484 265H599" fill="none" stroke="#5e7a70" stroke-opacity="0.78" stroke-width="2" />
    <path d="M142 111V265M343 111V265M544 111V265" fill="none" stroke="#ffd700" stroke-opacity="0.44" stroke-width="1.5" stroke-dasharray="5 7" />

    <g filter="url(#softGlow)">
      <circle cx="82" cy="111" r="7" fill="#00e6a0" />
      <circle cx="283" cy="111" r="7" fill="#ffe89a" />
      <circle cx="484" cy="111" r="7" fill="#00e6a0" />
      <circle cx="82" cy="265" r="7" fill="#ffe89a" />
      <circle cx="283" cy="265" r="7" fill="#00e6a0" />
      <circle cx="484" cy="265" r="7" fill="#ffe89a" />
    </g>

    <g>
      <rect x="22" y="82" width="120" height="58" rx="14" fill="#101a20" stroke="#00b86a" stroke-opacity="0.8" stroke-width="1.5" />
      <rect x="223" y="82" width="120" height="58" rx="14" fill="#101a20" stroke="#ffd700" stroke-opacity="0.75" stroke-width="1.5" />
      <rect x="424" y="82" width="120" height="58" rx="14" fill="#101a20" stroke="#00b86a" stroke-opacity="0.8" stroke-width="1.5" />
      <rect x="22" y="236" width="120" height="58" rx="14" fill="#101a20" stroke="#ffd700" stroke-opacity="0.75" stroke-width="1.5" />
      <rect x="223" y="236" width="120" height="58" rx="14" fill="#101a20" stroke="#00b86a" stroke-opacity="0.8" stroke-width="1.5" />
      <rect x="424" y="236" width="120" height="58" rx="14" fill="#101a20" stroke="#ffd700" stroke-opacity="0.75" stroke-width="1.5" />

      <text x="82" y="118" text-anchor="middle" fill="#e8f3ee" font-size="15" font-weight="700" letter-spacing="1.2">SOURCE</text>
      <text x="283" y="118" text-anchor="middle" fill="#fff7d9" font-size="15" font-weight="700" letter-spacing="1.2">ARCH</text>
      <text x="484" y="118" text-anchor="middle" fill="#e8f3ee" font-size="15" font-weight="700" letter-spacing="1.2">DECISIONS</text>
      <text x="82" y="272" text-anchor="middle" fill="#fff7d9" font-size="15" font-weight="700" letter-spacing="1.2">TESTS</text>
      <text x="283" y="272" text-anchor="middle" fill="#e8f3ee" font-size="15" font-weight="700" letter-spacing="1.2">HANDOFF</text>
      <text x="484" y="272" text-anchor="middle" fill="#fff7d9" font-size="15" font-weight="700" letter-spacing="1.2">NEXT AGENT</text>
    </g>

    <text x="322" y="354" text-anchor="middle" fill="#8998a5" font-size="13" font-weight="600" letter-spacing="2">TRACEABLE CONTEXT  ·  COMMITTED TO GIT</text>
  </g>

  <rect x="1" y="1" width="1598" height="498" rx="33" fill="none" stroke="#668078" stroke-opacity="0.3" stroke-width="2" />
</svg>
