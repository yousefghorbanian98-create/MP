<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">MP Brand exploration — A, Structural MP</title>
  <desc id="desc">Draft concept board for a geometric MP monogram, shown in color, monochrome, at launcher-icon sizes, and in a three-beat motion storyboard.</desc>
  <defs>
    <g id="mark-a" fill="none" stroke-linecap="square" stroke-linejoin="bevel">
      <path d="M32 142V52L91 108L150 52" stroke="#00B86A" stroke-width="15"/>
      <path d="M150 52V142M150 52H192C218 52 218 92 192 92H150" stroke="#FFD700" stroke-width="15"/>
    </g>
    <g id="mark-a-mono" fill="none" stroke="#F4F7F8" stroke-width="15" stroke-linecap="square" stroke-linejoin="bevel">
      <path d="M32 142V52L91 108L150 52V142"/>
      <path d="M150 52H192C218 52 218 92 192 92H150"/>
    </g>
    <style>
      .eyebrow { font: 700 14px 'DejaVu Sans', sans-serif; letter-spacing: 3px; fill: #91A0A8; }
      .title { font: 700 17px 'DejaVu Sans', sans-serif; letter-spacing: 2px; fill: #EAF0F2; }
      .copy { font: 400 14px 'DejaVu Sans', sans-serif; fill: #A7B4BA; }
      .micro { font: 600 11px 'DejaVu Sans', sans-serif; letter-spacing: 1.5px; fill: #839199; }
      .brand { font: 700 57px 'DejaVu Sans', sans-serif; letter-spacing: 7px; fill: #F3F6F8; }
      .brand2 { font: 500 47px 'DejaVu Sans', sans-serif; letter-spacing: 12px; fill: #00B86A; }
      .number { font: 700 12px 'DejaVu Sans Mono', monospace; fill: #C7D1D5; }
    </style>
  </defs>
  <rect width="1400" height="1000" fill="#0B0F14"/>
  <path d="M64 100H1336" stroke="#263139" stroke-width="1"/>
  <text x="64" y="58" class="eyebrow">MUSCLE PARADISE  /  BRAND EXPLORATION  /  M101</text>
  <text x="1336" y="58" class="eyebrow" text-anchor="end">DRAFT — NOT SELECTED</text>

  <rect x="64" y="130" width="336" height="336" rx="30" fill="#10171D" stroke="#29353D" stroke-width="2"/>
  <rect x="95" y="161" width="274" height="274" rx="38" fill="#0B0F14" stroke="#34414A" stroke-width="2"/>
  <use xlink:href="#mark-a" transform="translate(121 230) scale(0.9)"/>
  <text x="232" y="492" class="micro" text-anchor="middle">ADAPTIVE ICON · FLAT COLOR</text>

  <text x="465" y="191" class="eyebrow">A  /  STRUCTURAL MP</text>
  <text x="465" y="288" class="brand">MUSCLE</text>
  <text x="465" y="356" class="brand2">PARADISE</text>
  <path d="M466 393H890" stroke="#38464F" stroke-width="1"/>
  <text x="466" y="430" class="copy">A compact geometric monogram; M and P share a strong spine.</text>
  <text x="466" y="458" class="copy">The emerald / gold split is structural, not a lighting effect.</text>
  <rect x="1005" y="163" width="331" height="276" rx="22" fill="#10171D" stroke="#263139"/>
  <text x="1034" y="204" class="micro">CORE MARK / MONOCHROME</text>
  <use xlink:href="#mark-a-mono" transform="translate(1070 246) scale(0.76)"/>
  <text x="1034" y="402" class="copy">One-color form remains complete.</text>

  <rect x="64" y="550" width="1272" height="365" rx="24" fill="#0E151A" stroke="#263139" stroke-width="2"/>
  <text x="96" y="596" class="title">SMALL-SIZE CHECK</text>
  <text x="96" y="626" class="copy">Same silhouette; no gradient, bevel, or shadow required.</text>
  <g>
    <rect x="100" y="668" width="104" height="112" rx="14" fill="#0B0F14" stroke="#34414A"/>
    <use xlink:href="#mark-a" transform="translate(144 711) scale(0.064)"/>
    <text x="152" y="811" class="number" text-anchor="middle">16 px</text>
    <rect x="224" y="668" width="104" height="112" rx="14" fill="#0B0F14" stroke="#34414A"/>
    <use xlink:href="#mark-a" transform="translate(258 706) scale(0.096)"/>
    <text x="276" y="811" class="number" text-anchor="middle">24 px</text>
    <rect x="348" y="668" width="104" height="112" rx="14" fill="#0B0F14" stroke="#34414A"/>
    <use xlink:href="#mark-a" transform="translate(390 700) scale(0.128)"/>
    <text x="400" y="811" class="number" text-anchor="middle">32 px</text>
    <rect x="472" y="668" width="104" height="112" rx="14" fill="#0B0F14" stroke="#34414A"/>
    <use xlink:href="#mark-a" transform="translate(507 693) scale(0.192)"/>
    <text x="524" y="811" class="number" text-anchor="middle">48 px</text>
  </g>
  <path d="M616 625V868" stroke="#263139"/>
  <text x="660" y="596" class="title">MOTION STORYBOARD · 3 BEATS</text>
  <text x="660" y="626" class="copy">Draw the M spine, resolve the P bowl, settle on the static mark.</text>
  <g transform="translate(674 680)">
    <rect width="166" height="116" rx="16" fill="#0B0F14" stroke="#34414A"/>
    <path d="M51 79V38L83 66L115 38" fill="none" stroke="#00B86A" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel"/>
    <text x="83" y="101" class="micro" text-anchor="middle">01 · FORM</text>
  </g>
  <path d="M851 738H876" stroke="#50616B" stroke-width="2"/>
  <path d="M871 732L879 738L871 744" fill="none" stroke="#50616B" stroke-width="2"/>
  <g transform="translate(889 680)">
    <rect width="166" height="116" rx="16" fill="#0B0F14" stroke="#34414A"/>
    <path d="M38 79V38L72 66L106 38" fill="none" stroke="#00B86A" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel"/>
    <path d="M106 38V79M106 38H126C141 38 141 58 126 58H106" fill="none" stroke="#FFD700" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel"/>
    <text x="83" y="101" class="micro" text-anchor="middle">02 · RESOLVE</text>
  </g>
  <path d="M1066 738H1091" stroke="#50616B" stroke-width="2"/>
  <path d="M1086 732L1094 738L1086 744" fill="none" stroke="#50616B" stroke-width="2"/>
  <g transform="translate(1104 680)">
    <rect width="166" height="116" rx="16" fill="#0B0F14" stroke="#34414A"/>
    <use xlink:href="#mark-a" transform="translate(30 25) scale(0.43)"/>
    <text x="83" y="101" class="micro" text-anchor="middle">03 · SETTLE</text>
  </g>
  <text x="660" y="850" class="micro">OPTIONAL · NO FORCED WAIT · RESPECT REDUCED MOTION</text>
  <text x="64" y="962" class="micro">CONCEPT A — EXPLORATION ONLY · STATIC MARK FIRST · NOT A PRODUCTION ASSET</text>
  <text x="1336" y="962" class="micro" text-anchor="end">MP / 01</text>
</svg>
