# Muscle Paradise — ساخت APK اندروید (M28/باز-۱)
# جاب build فقط read-only است؛ تحویل دستی/آپلود Release در جاب‌های جدا و کمینه‌مجوز انجام می‌شود.
# تشخیص خطا فقط به‌صورت artifact کوتاه‌مدت است، نه commit/push روی شاخه.
name: mp-apk

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "شمارهٔ build"
        required: false
        default: "1"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version + pub get
        run: |
          set -o pipefail
          cd mp-app/client
          flutter --version | tee /tmp/step-pubget.txt
          flutter pub get 2>&1 | tee -a /tmp/step-pubget.txt

      - name: Analyze
        run: |
          set -o pipefail
          cd mp-app/client
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/step-analyze.txt

      - name: Test
        run: |
          set -o pipefail
          cd mp-app/client
          flutter test 2>&1 | tee /tmp/step-test.txt

      - name: Scaffold android platform (idempotent)
        run: |
          set -o pipefail
          cd mp-app/client
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.muscleparadise --project-name mp_client .
          fi

      - name: Pro launcher icons
        run: |
          set -o pipefail
          cd mp-app/client
          dart run flutter_launcher_icons 2>&1 | tee /tmp/step-icons.txt

      - name: Build APK + SHA256
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          set -o pipefail
          cd mp-app/client
          # versionName باید با تگ ریلیز هم‌خوان باشد، وگرنه نسخهٔ نصب‌شده روی دستگاه
          # قابل تشخیص نیست (REA 2026-11-15). تگ v0.2.0-client3 ← build-name 0.2.0-client3
          TAG="${{ github.ref_name }}"
          if [ -n "$TAG" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            BUILD_NAME="${TAG#v}"
            echo "build-name=$BUILD_NAME (from tag $TAG)"
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" 2>&1 | tee /tmp/step-build.txt
          else
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" 2>&1 | tee /tmp/step-build.txt
          fi
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      # M60 — بازرسی عمیق با apktool واقعی. پیش‌تر این مرحله نبود چون «java/apktool
      # در دسترس نیست»؛ هر دو با PyPI/npm تأمین می‌شوند (jdk4py + apk-revise).
      # بدون این مرحله، یک رگرسیون امنیتی در مانیفست فقط با چشم پیدا می‌شد.
      - name: Deep APK audit (apktool)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -o pipefail
          python -m pip install --quiet jdk4py==25.0.5.0
          export JAVA_HOME="$(python -c 'import jdk4py,pathlib;print(pathlib.Path(jdk4py.JAVA_HOME))')"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm install --silent --no-save apk-revise > /dev/null
          # اسکریپت مسیر پیش‌فرض /tmp/rev/… را می‌شناسد؛ APKTOOL_JAR صریح امن‌تر است
          export APKTOOL_JAR="$PWD/node_modules/apk-revise/bin/apktool.jar"
          python mp-app/client/tools/apk_deep_audit.py --json --out evidence/m60/apk-deep-audit.json | tee /tmp/step-deep-audit.txt

      - name: Collect APK diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/apk-ci
          cp /tmp/step-*.txt /tmp/apk-ci/ 2>/dev/null || true
          printf 'run=%s ref=%s\n' '${{ github.run_id }}' '${{ github.ref_name }}' > /tmp/apk-ci/RUN.txt
      - name: Upload APK diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-diagnostics-${{ github.run_id }}
          path: /tmp/apk-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muscleparadise-apk
          path: |
            mp-app/client/build/app/outputs/flutter-apk/*.apk
            mp-app/client/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error

  # فقط جاب تحویلِ دستی می‌تواند روی همان شاخه commit کند؛ build job read-only است.
  deliver-manual:
    if: ${{ needs.apk.result == 'success' && github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: muscleparadise-apk
          path: mp-app/client/release
      - name: Commit APK delivery on the selected branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          printf 'built-from: %s run: %s\n' '${{ github.sha }}' '${{ github.run_id }}' > mp-app/client/release/BUILD-INFO.txt
          git add mp-app/client/release
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "mp(apk): deliver APK build ${{ github.run_number }} [skip ci]"
          git push origin "HEAD:${BRANCH}"

  # تگ فقط artifact را به Release موجود اضافه می‌کند؛ build token هیچ‌گاه write نیست.
  publish-release:
    if: ${{ needs.apk.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muscleparadise-apk
          path: /tmp/muscleparadise-apk
      - name: Upload APK to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd /tmp/muscleparadise-apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.apk *.sha256 --clobber
          else
            echo "release does not exist; artifact remains available from this workflow run"
          fi
