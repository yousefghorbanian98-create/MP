# Muscle Paradise — ساخت APK اندروید (M28/باز-۱)
# جاب build فقط read-only است؛ تحویل دستی/آپلود Release در جاب‌های جدا و کمینه‌مجوز انجام می‌شود.
# تشخیص خطا فقط به‌صورت artifact کوتاه‌مدت است، نه commit/push روی شاخه.
name: mp-apk

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "شمارهٔ build"
        required: false
        default: "1"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version + pub get
        run: |
          set -o pipefail
          cd mp-app/client
          flutter --version | tee /tmp/step-pubget.txt
          flutter pub get 2>&1 | tee -a /tmp/step-pubget.txt

      - name: Analyze
        run: |
          set -o pipefail
          cd mp-app/client
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/step-analyze.txt

      - name: Test
        run: |
          set -o pipefail
          cd mp-app/client
          flutter test 2>&1 | tee /tmp/step-test.txt

      - name: Scaffold android platform (idempotent)
        run: |
          set -o pipefail
          cd mp-app/client
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.muscleparadise --project-name mp_client .
          fi

      - name: Pro launcher icons
        run: |
          set -o pipefail
          cd mp-app/client
          dart run flutter_launcher_icons 2>&1 | tee /tmp/step-icons.txt

      - name: Prepare dedicated release signing material
        env:
          KEYSTORE_B64: ${{ secrets.MP_ANDROID_KEYSTORE_BASE64 }}
          MP_ANDROID_STORE_PASSWORD: ${{ secrets.MP_ANDROID_STORE_PASSWORD }}
          MP_ANDROID_KEY_ALIAS: ${{ secrets.MP_ANDROID_KEY_ALIAS }}
          MP_ANDROID_KEY_PASSWORD: ${{ secrets.MP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$MP_ANDROID_STORE_PASSWORD" && test -n "$MP_ANDROID_KEY_ALIAS" && test -n "$MP_ANDROID_KEY_PASSWORD" || {
            echo "::error::Dedicated release signing secrets are required; refusing debug signing."
            exit 1
          }
          umask 077
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "mp-release.p12").write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"], validate=True))'
          echo "MP_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mp-release.p12" >> "$GITHUB_ENV"

      - name: Build APK + SHA256
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
          MP_ANDROID_STORE_PASSWORD: ${{ secrets.MP_ANDROID_STORE_PASSWORD }}
          MP_ANDROID_KEY_ALIAS: ${{ secrets.MP_ANDROID_KEY_ALIAS }}
          MP_ANDROID_KEY_PASSWORD: ${{ secrets.MP_ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd mp-app/client
          # versionName باید با تگ ریلیز هم‌خوان باشد، وگرنه نسخهٔ نصب‌شده روی دستگاه
          # قابل تشخیص نیست (REA 2026-11-15). تگ v0.2.0-client3 ← build-name 0.2.0-client3
          TAG="${{ github.ref_name }}"
          if [ -n "$TAG" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            BUILD_NAME="${TAG#v}"
            echo "build-name=$BUILD_NAME (from tag $TAG)"
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" 2>&1 | tee /tmp/step-build.txt
          else
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" 2>&1 | tee /tmp/step-build.txt
          fi
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Verify release signer on every APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.MP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::MP_ANDROID_CERT_SHA256 must be the SHA-256 of the dedicated release certificate."
            exit 1
          }
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$apksigner"
          for apk in mp-app/client/build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$apk"
            output="$("$apksigner" verify --verbose --print-certs "$apk")"
            count="$(printf '%s\n' "$output" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:')"
            actual="$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
            if [ "$count" != 1 ] || [ "$actual" != "$expected" ]; then
              echo "::error::Release signature does not match the pinned certificate."
              exit 1
            fi
          done

      # M60 — بازرسی عمیق با apktool واقعی. پیش‌تر این مرحله نبود چون «java/apktool
      # در دسترس نیست»؛ هر دو با PyPI/npm تأمین می‌شوند (jdk4py + apk-revise).
      # بدون این مرحله، یک رگرسیون امنیتی در مانیفست فقط با چشم پیدا می‌شد.
      - name: Deep APK audit (apktool)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -o pipefail
          python -m pip install --quiet jdk4py==25.0.5.0
          export JAVA_HOME="$(python -c 'import jdk4py,pathlib;print(pathlib.Path(jdk4py.JAVA_HOME))')"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm install --silent --no-save apk-revise > /dev/null
          # اسکریپت مسیر پیش‌فرض /tmp/rev/… را می‌شناسد؛ APKTOOL_JAR صریح امن‌تر است
          export APKTOOL_JAR="$PWD/node_modules/apk-revise/bin/apktool.jar"
          mkdir -p evidence/m60
          for apk in mp-app/client/build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$apk"
            name="$(basename "$apk" .apk)"
            python mp-app/client/tools/apk_deep_audit.py --apk "$apk" --json --out "evidence/m60/${name}-audit.json"
          done

      - name: Delete temporary release signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mp-release.p12"

      - name: Collect APK diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/apk-ci
          cp /tmp/step-*.txt /tmp/apk-ci/ 2>/dev/null || true
          printf 'run=%s ref=%s\n' '${{ github.run_id }}' '${{ github.ref_name }}' > /tmp/apk-ci/RUN.txt
      - name: Upload APK diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-diagnostics-${{ github.run_id }}
          path: /tmp/apk-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muscleparadise-apk
          path: |
            mp-app/client/build/app/outputs/flutter-apk/*.apk
            mp-app/client/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error

  # Build output is a CI artifact only. A release must be published separately,
  # after the exact commit has passed every required gate and release review.
