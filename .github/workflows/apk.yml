# Muscle Paradise — ساخت APK اندروید (M28/باز-۱)
# خروجی‌ها: آرتیفکت + commit در mp-app/client/release/ (قابل دریافت از مخزن)
# تشخیص خطا: کامنت issue با برچسب apk-diagnostics
name: mp-apk

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "شمارهٔ build"
        required: false
        default: "1"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version + pub get
        run: |
          set -o pipefail
          cd mp-app/client
          flutter --version | tee /tmp/step-pubget.txt
          flutter pub get 2>&1 | tee -a /tmp/step-pubget.txt

      - name: Analyze
        run: |
          set -o pipefail
          cd mp-app/client
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/step-analyze.txt

      - name: Test
        run: |
          set -o pipefail
          cd mp-app/client
          flutter test 2>&1 | tee /tmp/step-test.txt

      - name: Scaffold android platform (idempotent)
        run: |
          set -o pipefail
          cd mp-app/client
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.muscleparadise --project-name mp_client .
          fi

      - name: Pro launcher icons
        run: |
          set -o pipefail
          cd mp-app/client
          dart run flutter_launcher_icons 2>&1 | tee /tmp/step-icons.txt

      - name: Build APK + SHA256
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          set -o pipefail
          cd mp-app/client
          # versionName باید با تگ ریلیز هم‌خوان باشد، وگرنه نسخهٔ نصب‌شده روی دستگاه
          # قابل تشخیص نیست (REA 2026-11-15). تگ v0.2.0-client3 ← build-name 0.2.0-client3
          TAG="${{ github.ref_name }}"
          if [ -n "$TAG" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            BUILD_NAME="${TAG#v}"
            echo "build-name=$BUILD_NAME (from tag $TAG)"
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" 2>&1 | tee /tmp/step-build.txt
          else
            flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" 2>&1 | tee /tmp/step-build.txt
          fi
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      # M60 — بازرسی عمیق با apktool واقعی. پیش‌تر این مرحله نبود چون «java/apktool
      # در دسترس نیست»؛ هر دو با PyPI/npm تأمین می‌شوند (jdk4py + apk-revise).
      # بدون این مرحله، یک رگرسیون امنیتی در مانیفست فقط با چشم پیدا می‌شد.
      - name: Deep APK audit (apktool)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -o pipefail
          python -m pip install --quiet jdk4py==25.0.5.0
          export JAVA_HOME="$(python -c 'import jdk4py,pathlib;print(pathlib.Path(jdk4py.JAVA_HOME))')"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm install --silent --no-save apk-revise > /dev/null
          # اسکریپت مسیر پیش‌فرض /tmp/rev/… را می‌شناسد؛ APKTOOL_JAR صریح امن‌تر است
          export APKTOOL_JAR="$PWD/node_modules/apk-revise/bin/apktool.jar"
          python mp-app/client/tools/apk_deep_audit.py --json --out evidence/m60/apk-deep-audit.json | tee /tmp/step-deep-audit.txt

      - name: Commit diagnostics on failure
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p finn/reports/apk-ci
          cp /tmp/step-*.txt finn/reports/apk-ci/ 2>/dev/null || true
          echo "run=${{ github.run_id }} ref=${{ github.ref_name }}" > finn/reports/apk-ci/RUN.txt
          git add finn/reports/apk-ci
          git commit -m "mp(apk): diagnostics run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
            sleep 6
          done

      - name: Commit APK into repo (delivery)
        if: success()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p mp-app/client/release
          cp mp-app/client/build/app/outputs/flutter-apk/*.apk mp-app/client/release/ 2>/dev/null || true
          cp mp-app/client/build/app/outputs/flutter-apk/*.sha256 mp-app/client/release/ 2>/dev/null || true
          echo "built-from: ${{ github.sha }} run: ${{ github.run_id }}" > mp-app/client/release/BUILD-INFO.txt
          git add mp-app/client/release mp-app/client/android 2>/dev/null || git add mp-app/client/release
          git commit -m "mp(apk): deliver APK build ${{ github.run_number }} [skip ci]" || echo "no changes"
          git push origin "HEAD:$BRANCH"

      - name: Upload APK to GitHub Release (if exists for tag)
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cd mp-app/client/release
          gh release upload "${{ github.ref_name }}" *.apk *.sha256 --clobber 2>/dev/null || echo "release بدون انتشار — رد می‌شود"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muscleparadise-apk
          path: |
            mp-app/client/build/app/outputs/flutter-apk/*.apk
            mp-app/client/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error
