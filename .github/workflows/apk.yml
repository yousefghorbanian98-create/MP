# Muscle Paradise — ساخت APK اندروید (M28/باز-۱)
# خروجی‌ها: آرتیفکت + commit در mp-app/client/release/ (قابل دریافت از مخزن)
# تشخیص خطا: کامنت issue با برچسب apk-diagnostics
name: mp-apk

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "شمارهٔ build"
        required: false
        default: "1"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version + pub get
        run: |
          cd mp-app/client
          flutter --version | tee /tmp/step-pubget.txt
          flutter pub get 2>&1 | tee -a /tmp/step-pubget.txt

      - name: Analyze
        run: |
          cd mp-app/client
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/step-analyze.txt

      - name: Test
        run: |
          cd mp-app/client
          flutter test 2>&1 | tee /tmp/step-test.txt

      - name: Scaffold android platform (idempotent)
        run: |
          cd mp-app/client
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.muscleparadise --project-name mp_client .
          fi

      - name: Build APK + SHA256
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          cd mp-app/client
          flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER" 2>&1 | tee /tmp/step-build.txt
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Commit diagnostics on failure
        if: failure()
        env:
          BRANCH: arena/a0408b29-mp
        run: |
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p finn/reports/apk-ci
          cp /tmp/step-*.txt finn/reports/apk-ci/ 2>/dev/null || true
          echo "run=${{ github.run_id }} ref=${{ github.ref_name }}" > finn/reports/apk-ci/RUN.txt
          git add finn/reports/apk-ci
          git commit -m "mp(apk): diagnostics run ${{ github.run_id }} [skip ci]" || true
          git push origin "$BRANCH"

      - name: Commit APK into repo (delivery)
        if: success()
        env:
          BRANCH: arena/a0408b29-mp
        run: |
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p mp-app/client/release
          cp mp-app/client/build/app/outputs/flutter-apk/*.apk mp-app/client/release/ 2>/dev/null || true
          cp mp-app/client/build/app/outputs/flutter-apk/*.sha256 mp-app/client/release/ 2>/dev/null || true
          echo "built-from: ${{ github.sha }} run: ${{ github.run_id }}" > mp-app/client/release/BUILD-INFO.txt
          git add mp-app/client/release mp-app/client/android 2>/dev/null || git add mp-app/client/release
          git commit -m "mp(apk): deliver APK build ${{ github.run_number }} [skip ci]" || echo "no changes"
          git push origin "$BRANCH"

      - name: Upload APK to GitHub Release (if exists for tag)
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd mp-app/client/release
          gh release upload "${{ github.ref_name }}" *.apk *.sha256 --clobber 2>/dev/null || echo "release بدون انتشار — رد می‌شود"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muscleparadise-apk
          path: |
            mp-app/client/build/app/outputs/flutter-apk/*.apk
            mp-app/client/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error
