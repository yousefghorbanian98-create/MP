# Muscle Paradise — ساخت APK اندروید (M28/باز-۱)
# اجرا: workflow_dispatch یا push تگ v*
name: mp-apk

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "شمارهٔ build"
        required: false
        default: "1"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version + pub get
        run: |
          cd mp-app/client
          flutter --version
          flutter pub get

      - name: Analyze
        run: |
          cd mp-app/client
          flutter analyze --no-fatal-infos

      - name: Test
        run: |
          cd mp-app/client
          flutter test

      - name: Build APK + SHA256
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          cd mp-app/client
          flutter build apk --release --split-per-abi --build-number="$BUILD_NUMBER"
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muscleparadise-apk
          path: |
            mp-app/client/build/app/outputs/flutter-apk/*.apk
            mp-app/client/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-diagnostics
          path: mp-app/client/
          retention-days: 3
