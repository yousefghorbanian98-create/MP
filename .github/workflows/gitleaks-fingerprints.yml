# Dispatch-only; prints validated metadata and never prints matched values.
name: Gitleaks fingerprint audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks-fingerprints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "  $archive$" gitleaks-checksums.txt | sha256sum --check)
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks gitleaks
      - name: Report only validated finding metadata
        run: |
          set +e
          /tmp/gitleaks/gitleaks git --redact --no-banner --log-level=error \
            --report-format=json --report-path=/tmp/gitleaks-report.json .
          scan_status=$?
          set -e
          SCAN_STATUS="$scan_status" python3 - <<'PYCODE'
          import json
          import os
          import re
          from pathlib import Path

          status = int(os.environ['SCAN_STATUS'])
          report = Path('/tmp/gitleaks-report.json')
          if status not in (0, 1) or not report.is_file():
              raise SystemExit('Scanner failed or report missing')
          findings = json.loads(report.read_text())
          if not isinstance(findings, list):
              raise SystemExit('Unexpected report format')
          print(f'Findings: {len(findings)}')
          for item in findings:
              rule, path, line, commit, fingerprint = (item.get(k) for k in
                  ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint'))
              # Restrict all output so malformed scanner data cannot inject commands
              # or leak unexpected fields such as Match, Secret, or source lines.
              if not (isinstance(rule, str) and re.fullmatch(r'[A-Za-z0-9_-]+', rule)
                      and isinstance(path, str) and re.fullmatch(r'[A-Za-z0-9_./-]+', path)
                      and isinstance(line, int) and line > 0
                      and isinstance(commit, str) and re.fullmatch(r'[0-9a-f]{40}', commit)
                      and isinstance(fingerprint, str)
                      and fingerprint == f'{commit}:{path}:{rule}:{line}'):
                  raise SystemExit('Invalid metadata; refusing to print')
              message = f'{rule} {path}:{line} {commit} {fingerprint}'
              print(message)
              print(f'::notice title=Gitleaks fingerprint::{message}')
          PYCODE

