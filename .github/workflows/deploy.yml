# Muscle Paradise — manual Dokploy deployment. Production is never triggered by push.
name: mp-deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Deploy a new image, or roll back to an explicit prior SHA/version GHCR tag"
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy
      target:
        description: "Protected GitHub environment to use"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      rollback_image:
        description: "Full prior GHCR image ref, required only for rollback"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require dispatch from the protected default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH" || { echo "Could not determine the repository default branch" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Dispatch this workflow from the protected default branch ($DEFAULT_BRANCH)" >&2; exit 1;
          }

  build-and-push:
    needs: [preflight]
    if: ${{ inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Log in to GHCR with the short-lived workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push SHA-tagged backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: mp-app/infra/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mp-backend:${{ github.sha }}
      - name: Build and push SHA-tagged Studio image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: mp-app/studio/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mp-studio:${{ github.sha }}

  deploy:
    if: ${{ inputs.operation == 'deploy' }}
    needs: [preflight, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: Validate protected environment configuration
        shell: bash
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_WEBHOOK" || { echo "DOKPLOY_WEBHOOK is required in the selected environment" >&2; exit 1; }
          test -n "$APP_URL" || { echo "APP_URL is required in the selected environment" >&2; exit 1; }
          [[ "$DOKPLOY_WEBHOOK" == https://* ]] || { echo "DOKPLOY_WEBHOOK must use HTTPS" >&2; exit 1; }
          [[ "$APP_URL" == https://* ]] || { echo "APP_URL must use HTTPS" >&2; exit 1; }
      - name: Trigger Dokploy with the SHA-tagged backend image
        shell: bash
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mp-backend:${{ github.sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg image "$IMAGE" --arg target "$TARGET" '{image:$image,target:$target}')"
          curl -fsS --max-time 20 -X POST "$DOKPLOY_WEBHOOK" \
            -H "Content-Type: application/json" -d "$payload"
      - name: Readiness gate
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors --max-time 10 \
            "${APP_URL%/}/api/v1/health/ready" | jq -e '.ready == true'

  rollback:
    needs: [preflight]
    if: ${{ inputs.operation == 'rollback' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate explicit rollback image and protected environment
        shell: bash
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          APP_URL: ${{ secrets.APP_URL }}
          IMAGE: ${{ inputs.rollback_image }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_WEBHOOK" || { echo "DOKPLOY_WEBHOOK is required in the selected environment" >&2; exit 1; }
          test -n "$APP_URL" || { echo "APP_URL is required in the selected environment" >&2; exit 1; }
          [[ "$DOKPLOY_WEBHOOK" == https://* && "$APP_URL" == https://* ]] || {
            echo "Webhook and app URL must use HTTPS" >&2; exit 1;
          }
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+/mp-backend:([0-9a-f]{40}|v[0-9]+(\.[0-9]+){1,2}([-+][A-Za-z0-9.-]+)?)$ ]] || {
            echo "Supply a prior SHA or version-tagged ghcr.io/<owner>/mp-backend image" >&2; exit 1;
          }
      - name: Request rollback to the explicit image tag
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          IMAGE: ${{ inputs.rollback_image }}
        run: bash mp-app/infra/scripts/rollback.sh "$DOKPLOY_WEBHOOK" "$IMAGE"
      - name: Readiness gate after rollback
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors --max-time 10 \
            "${APP_URL%/}/api/v1/health/ready" | jq -e '.ready == true'
