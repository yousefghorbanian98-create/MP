# Muscle Paradise — CI: lint → test → build → scan
name: mp-ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -e "mp-app/backend[dev]"
      - name: Lint (ruff)
        run: |
          cd mp-app/backend
          ruff check .
          ruff format --check .
      - name: Test (pytest + coverage ≥70%)
        run: |
          cd mp-app/backend
          pytest --cov=. --cov-report=xml --cov-fail-under=70
      - name: Security scan (bandit + pip-audit)
        run: |
          pip install -U "setuptools>=84.1"   # رفع آسیب‌پذیری‌های PYSEC-2026-3447/GHSA-xmj3
          cd mp-app/backend
          bandit -r . -ll -q
          pip-audit
      # قواعد پروژه‌ای semgrep (`.semgrep/project-rules.yml`) — بدون نیاز به
      # semgrep.dev؛ همان قواعدی که یافتهٔ «تأیید پرداخت بدون درگاه» را داد.
      - name: Semgrep (project rules)
        # semgrep در venv مجزا نصب می‌شود: در venv پروژه با opentelemetry
        # تعارض می‌کند و با ImportError کرش می‌کند (یک بار در CI همین شد).
        run: |
          python -m venv /tmp/sgvenv
          /tmp/sgvenv/bin/pip install -q semgrep
          /tmp/sgvenv/bin/semgrep --config=.semgrep/project-rules.yml --error \
            --exclude=.venv --exclude=node_modules --exclude=__pycache__ mp-app

      - name: Commit backend diagnostics (on failure)
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          cd mp-app/backend
          ruff check . > /tmp/backend-lint.txt 2>&1 || true
          ruff format --check . >> /tmp/backend-lint.txt 2>&1 || true
          bandit -r . -ll -q > /tmp/backend-bandit.txt 2>&1 || true
          pip-audit > /tmp/backend-pipaudit.txt 2>&1 || true
          pytest tests -q --tb=short > /tmp/backend-test.txt 2>&1 || true
          cd ../..
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p finn/reports/backend-ci
          cp /tmp/backend-lint.txt /tmp/backend-bandit.txt /tmp/backend-pipaudit.txt /tmp/backend-test.txt finn/reports/backend-ci/
          echo "run=${{ github.run_id }} job=backend" > finn/reports/backend-ci/RUN.txt
          git add finn/reports/backend-ci
          git commit -m "mp(apk): backend diagnostics run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "$BRANCH" && break
            sleep 6
          done

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Unit tests (Vitest) — شامل گیت‌های WCAG و sync توکن‌ها
        working-directory: mp-app/studio
        run: npm test
      - name: Build (Vite)
        working-directory: mp-app/studio
        run: npm run build
      - name: Audit (بدون بحرانی)
        working-directory: mp-app/studio
        run: |
          npm audit --audit-level=critical || true
          npm audit 2>&1 | tee audit.txt
          ! grep -q "Severity: critical" audit.txt

  client-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: mp-app/client
        run: flutter pub get
      - name: flutter analyze (errors/warnings fatal — infos گزارش می‌شود)
        working-directory: mp-app/client
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        working-directory: mp-app/client
        run: flutter test

      - name: Commit client diagnostics (on failure)
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          cd mp-app/client
          flutter analyze --no-fatal-infos > /tmp/client-analyze.txt 2>&1 || true
          flutter test > /tmp/client-test.txt 2>&1 || true
          cd ../..
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p finn/reports/client-ci
          cp /tmp/client-analyze.txt /tmp/client-test.txt finn/reports/client-ci/
          echo "run=${{ github.run_id }} job=client-flutter" > finn/reports/client-ci/RUN.txt
          git add finn/reports/client-ci
          git commit -m "mp(apk): client diagnostics run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "$BRANCH" && break
            sleep 6
          done

  # اثبات واقعی «فرانت و بک‌اند با هم کار می‌کنند»: کلاینت TypeScript
  # استودیو روی یک سرور زندهٔ uvicorn اجرا می‌شود. تست‌های mock این را
  # اثبات نمی‌کنند — یک تغییر نام فیلد در بک‌اند همه‌شان را سبز می‌گذارد
  # (و همین شد: full_name عدد برمی‌گرداند و هیچ تستی نگرفت).
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: pip install -e "mp-app/backend[dev]"
      - name: Seed + run API
        run: |
          cd mp-app/backend
          python - <<'EOF'
          from db.base import init_db, get_session_factory
          from db.models import Member, User, Exercise
          from security.crypto import FaceEmbeddingCipher  # noqa: F401
          init_db()
          with get_session_factory()() as s:
              u = User(phone="09120000001", full_name="Admin", role="manager")
              s.add(u); s.commit()
              s.add(Member(user_id=u.id, gender="male", goal="hypertrophy", branch_id=1,
                           emergency_contact=""))
              s.commit()
              for i in range(1, 18):
                  s.add(Exercise(id=i, external_id=f"e{i}", name_fa=f"حرکت {i}",
                                 name_en=f"ex {i}", muscle_group="legs",
                                 video_url=f"/static/exercises/{i}_0.jpg"))
              s.commit()
          print("seeded")
          EOF
          nohup python -m uvicorn app.main:create_app --factory --port 8000 \
            --host 127.0.0.1 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Install studio
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Live contract (studio TS client × real API)
        working-directory: mp-app/studio
        run: |
          TOKEN=$(cd ../backend && python -c "from app.security.jwt import create_access_token; print(create_access_token(1,'manager'))")
          MP_API_BASE=http://127.0.0.1:8000 MP_TOKEN="$TOKEN" npm test -- tests/liveContract.test.ts

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "mp-app/backend[dev]"
      - name: E2E مسیرهای حیاتی (ثبت‌نام→پرداخت→چک‌این + تأیید برنامه)
        run: |
          cd mp-app/backend
          pytest tests/integration -q
