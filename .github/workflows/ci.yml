# Muscle Paradise — CI: lint → test → build → scan
name: mp-ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -e "mp-app/backend[dev]"
      - name: Lint (ruff)
        run: |
          cd mp-app/backend
          ruff check .
          ruff format --check .
      - name: Test (pytest + coverage ≥70%)
        run: |
          cd mp-app/backend
          pytest --cov=. --cov-report=xml --cov-fail-under=70
      - name: Security scan (bandit + pip-audit)
        run: |
          pip install -U "setuptools>=84.1"   # رفع آسیب‌پذیری‌های PYSEC-2026-3447/GHSA-xmj3
          cd mp-app/backend
          bandit -r . -ll -q
          pip-audit

      - name: Commit backend diagnostics (on failure)
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          cd mp-app/backend
          ruff check . > /tmp/backend-lint.txt 2>&1 || true
          ruff format --check . >> /tmp/backend-lint.txt 2>&1 || true
          bandit -r . -ll -q > /tmp/backend-bandit.txt 2>&1 || true
          pip-audit > /tmp/backend-pipaudit.txt 2>&1 || true
          pytest tests -q --tb=short > /tmp/backend-test.txt 2>&1 || true
          cd ../..
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p finn/reports/backend-ci
          cp /tmp/backend-lint.txt /tmp/backend-bandit.txt /tmp/backend-pipaudit.txt /tmp/backend-test.txt finn/reports/backend-ci/
          echo "run=${{ github.run_id }} job=backend" > finn/reports/backend-ci/RUN.txt
          git add finn/reports/backend-ci
          git commit -m "mp(apk): backend diagnostics run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "$BRANCH" && break
            sleep 6
          done

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Unit tests (Vitest) — شامل گیت‌های WCAG و sync توکن‌ها
        working-directory: mp-app/studio
        run: npm test
      - name: Build (Vite)
        working-directory: mp-app/studio
        run: npm run build
      - name: Audit (بدون بحرانی)
        working-directory: mp-app/studio
        run: |
          npm audit --audit-level=critical || true
          npm audit 2>&1 | tee audit.txt
          ! grep -q "Severity: critical" audit.txt

  client-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: mp-app/client
        run: flutter pub get
      - name: flutter analyze (errors/warnings fatal — infos گزارش می‌شود)
        working-directory: mp-app/client
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        working-directory: mp-app/client
        run: flutter test

      - name: Commit client diagnostics (on failure)
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          cd mp-app/client
          flutter analyze --no-fatal-infos > /tmp/client-analyze.txt 2>&1 || true
          flutter test > /tmp/client-test.txt 2>&1 || true
          cd ../..
          git config user.name "mp-apk-ci"
          git config user.email "ci@muscleparadise.local"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p finn/reports/client-ci
          cp /tmp/client-analyze.txt /tmp/client-test.txt finn/reports/client-ci/
          echo "run=${{ github.run_id }} job=client-flutter" > finn/reports/client-ci/RUN.txt
          git add finn/reports/client-ci
          git commit -m "mp(apk): client diagnostics run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "$BRANCH" && break
            sleep 6
          done

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "mp-app/backend[dev]"
      - name: E2E مسیرهای حیاتی (ثبت‌نام→پرداخت→چک‌این + تأیید برنامه)
        run: |
          cd mp-app/backend
          pytest tests/integration -q
