# Muscle Paradise — CI: lint → test → build → scan
name: mp-ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

# The CI pipeline only needs to read source; failure diagnostics are artifacts,
# not commits back into whichever branch triggered this run.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the MIT Gitleaks CLI, not gitleaks/gitleaks-action (its repository
      # does not declare a licence). Verify the official release checksum and
      # redact findings so a discovered credential is never printed to logs.
      - name: Install verified Gitleaks CLI
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "  $archive$" gitleaks-checksums.txt | sha256sum --check)
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version
      - name: Scan full Git history (redacted metadata)
        run: |
          set +e
          /tmp/gitleaks/gitleaks git --redact --no-banner --log-level=error \
            --report-format=json --report-path=/tmp/gitleaks-report.json .
          scan_status=$?
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("/tmp/gitleaks-report.json")
          findings = []
          if report.is_file():
              try:
                  parsed = json.loads(report.read_text(encoding="utf-8"))
                  findings = parsed if isinstance(parsed, list) else []
              except (OSError, json.JSONDecodeError):
                  findings = []

          def escape_command_value(value: object) -> str:
              return (
                  str(value)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          summary = ["### Gitleaks scan (redacted metadata)"]
          summary.append(f"Potential findings: {len(findings)}. Secret values are never included.")
          for finding in findings[:40]:
              path = finding.get("File", "unknown path")
              rule = finding.get("RuleID", "unknown rule")
              line = finding.get("StartLine", 0)
              commit = str(finding.get("Commit", ""))[:12]
              message = f"Potential secret match ({rule}); value withheld; commit {commit or 'unknown'}."
              print(
                  f"::error file={escape_command_value(path)},line={line},title=Gitleaks finding::"
                  f"{escape_command_value(message)}"
              )
              summary.append(f"- `{path}:{line}` — `{rule}`; commit `{commit or 'unknown'}` (value withheld).")
          if not report.is_file():
              summary.append("No JSON report was produced; inspect the scanner step output after checking access restrictions.")
              print("::error::Gitleaks failed without a readable JSON report; no secret values were emitted by this summary.")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as stream:
                  stream.write("\n".join(summary) + "\n")
          PY
          exit "$scan_status"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -e "mp-app/backend[dev]"
      - name: Lint (ruff)
        run: |
          cd mp-app/backend
          ruff check .
          ruff format --check .
      - name: Test (pytest + coverage ≥70%)
        run: |
          cd mp-app/backend
          pytest --cov=. --cov-report=xml --cov-fail-under=70
      - name: Security scan (bandit + pip-audit)
        run: |
          pip install -U "setuptools>=84.1"   # رفع آسیب‌پذیری‌های PYSEC-2026-3447/GHSA-xmj3
          cd mp-app/backend
          bandit -r . -ll -q
          pip-audit
      # قواعد پروژه‌ای semgrep (`.semgrep/project-rules.yml`) — بدون نیاز به
      # semgrep.dev؛ همان قواعدی که یافتهٔ «تأیید پرداخت بدون درگاه» را داد.
      - name: Semgrep (project rules)
        # semgrep در venv مجزا نصب می‌شود: در venv پروژه با opentelemetry
        # تعارض می‌کند و با ImportError کرش می‌کند (یک بار در CI همین شد).
        run: |
          python -m venv /tmp/sgvenv
          /tmp/sgvenv/bin/pip install -q semgrep
          /tmp/sgvenv/bin/semgrep --config=.semgrep/project-rules.yml --error \
            --exclude=.venv --exclude=node_modules --exclude=__pycache__ mp-app

      - name: Collect backend diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/backend-ci
          cd mp-app/backend
          ruff check . > /tmp/backend-ci/lint.txt 2>&1 || true
          ruff format --check . >> /tmp/backend-ci/lint.txt 2>&1 || true
          bandit -r . -ll -q > /tmp/backend-ci/bandit.txt 2>&1 || true
          pip-audit > /tmp/backend-ci/pip-audit.txt 2>&1 || true
          pytest tests -q --tb=short > /tmp/backend-ci/pytest.txt 2>&1 || true
          printf 'run=%s job=backend\n' '${{ github.run_id }}' > /tmp/backend-ci/RUN.txt
      - name: Upload backend diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.run_id }}
          path: /tmp/backend-ci/
          if-no-files-found: warn
          retention-days: 7

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Unit tests (Vitest) — شامل گیت‌های WCAG و sync توکن‌ها
        working-directory: mp-app/studio
        run: npm test
      - name: Build (Vite)
        working-directory: mp-app/studio
        run: npm run build
      - name: Audit (بدون بحرانی)
        working-directory: mp-app/studio
        run: |
          npm audit --audit-level=critical || true
          npm audit 2>&1 | tee audit.txt
          ! grep -q "Severity: critical" audit.txt

  client-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: mp-app/client
        run: flutter pub get
      - name: flutter analyze (گیت روی error/warning — نه info)
        working-directory: mp-app/client
        # `channel: stable` شناور است. Infoها غیرکشنده‌اند تا deprecation noticeهای
        # SDK جاب را قرمز نکنند؛ error و warning همچنان گیت را fail می‌کنند.
        run: |
          set -o pipefail
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.txt 2>&1
          analyze_status=$?
          machine_status=0
          if [ "$analyze_status" -ne 0 ]; then
            # Flutter's human-readable analyzer output can change with the floating
            # stable SDK. Use Dart's documented machine format as a diagnostic
            # fallback, while retaining flutter analyze as the actual CI gate.
            dart analyze --format=machine . > /tmp/analyze.machine 2>&1
            machine_status=$?
          else
            : > /tmp/analyze.machine
          fi
          set -e
          tail -n 40 /tmp/analyze.txt
          ANALYZE_STATUS="$analyze_status" MACHINE_STATUS="$machine_status" python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          machine_status = int(os.environ["MACHINE_STATUS"])
          raw_lines = Path("/tmp/analyze.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          error_lines = [line for line in raw_lines if re.match(r"^\s*error\s*•", line)]
          pattern = re.compile(r"^\s*error\s*•\s*(.*?)\s*•\s*(.+?):(\d+):(\d+)\s*•\s*(.*)$")
          machine_diagnostics = []
          for line in Path("/tmp/analyze.machine").read_text(encoding="utf-8", errors="replace").splitlines():
              fields = line.split("|", 7)
              if len(fields) == 8 and fields[0] in {"ERROR", "WARNING", "INFO"}:
                  severity, _kind, code, path, line_number, column, _length, message = fields
                  machine_diagnostics.append((severity, code, path, line_number, column, message))
          severity_order = {"ERROR": 0, "WARNING": 1, "INFO": 2}
          machine_diagnostics.sort(
              key=lambda item: (severity_order[item[0]], item[2], int(item[3]), int(item[4]))
          )

          def escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")

          summary = ["### Flutter analyzer diagnostics"]
          if analyze_status == 0:
              print("analyze: no fatal analyzer diagnostics")
              summary.append("No fatal analyzer diagnostics found.")
          elif machine_diagnostics:
              level = {"ERROR": "error", "WARNING": "warning", "INFO": "notice"}
              print(f"flutter analyze exited {analyze_status}; Dart machine analyzer status {machine_status}.")
              for severity, code, path, line_number, column, message in machine_diagnostics[:50]:
                  annotation = level[severity]
                  safe_message = f"{message} [{code}]" if code else message
                  print(
                      f"::{annotation} file={escape(path)},line={line_number},col={column},title=Dart analyzer::"
                      f"{escape(safe_message)}"
                  )
                  summary.append(f"- `{path}:{line_number}:{column}` — {message} (`{code}`; {severity.lower()})")
              summary.insert(1, f"Machine-format diagnostics: {len(machine_diagnostics)}.")
          elif error_lines:
              print("::error::flutter analyze: error diagnostics found; human-format fallback parsed")
              for line in error_lines[:50]:
                  match = pattern.match(line)
                  if match:
                      message, path, line_number, column, code = match.groups()
                      safe_message = f"{message} [{code}]" if code else message
                      print(
                          f"::error file={escape(path)},line={line_number},col={column},title=Dart analyzer::"
                          f"{escape(safe_message)}"
                      )
                      summary.append(f"- `{path}:{line_number}:{column}` — {message} (`{code}`)")
                  else:
                      print("::error::Flutter analyzer reported an error; see the redacted diagnostic artifact.")
                      summary.append("An analyzer error was reported; its location could not be parsed safely.")
              summary.insert(1, f"Error diagnostics: {len(error_lines)}.")
          else:
              print(f"::error::flutter analyze exited {analyze_status} without a parseable diagnostic")
              summary.append(
                  f"Analyzer command failed with exit status {analyze_status}; Dart machine analysis returned {machine_status} without parseable diagnostics."
              )
          summary.insert(1, f"Flutter analyzer exit status: {analyze_status}.")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as stream:
                  stream.write("\n".join(summary) + "\n")
          sys.exit(1 if analyze_status != 0 else 0)
          PY
      - name: flutter test
        working-directory: mp-app/client
        run: flutter test

      # M60 — گیت مانیفست. اجرای 43828454021 نشان داد `android:debuggable="false"`
      # در سورس، `lintVitalRelease` را می‌شکند و بیلد release را متوقف می‌کند.
      # آن ویژگی برای «سخت‌کردن» اضافه شده بود، ولی اپ را امن‌تر نمی‌کرد.
      - name: manifest gate (ویژگی‌های شکست‌دهندهٔ lintVitalRelease)
        working-directory: mp-app/client
        run: python3 tools/manifest_gate.py

      - name: Collect client diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/client-ci
          cd mp-app/client
          flutter analyze --no-fatal-infos > /tmp/client-ci/analyze.txt 2>&1 || true
          dart analyze --format=machine . > /tmp/client-ci/analyze.machine.txt 2>&1 || true
          flutter test > /tmp/client-ci/flutter-test.txt 2>&1 || true
          printf 'run=%s job=client-flutter\n' '${{ github.run_id }}' > /tmp/client-ci/RUN.txt
      - name: Upload client diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-diagnostics-${{ github.run_id }}
          path: /tmp/client-ci/
          if-no-files-found: warn
          retention-days: 7

  # اثبات واقعی «فرانت و بک‌اند با هم کار می‌کنند»: کلاینت TypeScript
  # استودیو روی یک سرور زندهٔ uvicorn اجرا می‌شود. تست‌های mock این را
  # اثبات نمی‌کنند — یک تغییر نام فیلد در بک‌اند همه‌شان را سبز می‌گذارد
  # (و همین شد: full_name عدد برمی‌گرداند و هیچ تستی نگرفت).
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: pip install -e "mp-app/backend[dev]"
      - name: Seed + run API
        run: |
          cd mp-app/backend
          python - <<'EOF'
          from db.base import init_db, get_session_factory
          from db.models import Member, User, Exercise
          from security.crypto import FaceEmbeddingCipher  # noqa: F401
          init_db()
          with get_session_factory()() as s:
              u = User(phone="09120000001", full_name="Admin", role="manager")
              s.add(u); s.commit()
              s.add(Member(user_id=u.id, gender="male", goal="hypertrophy", branch_id=1,
                           emergency_contact=""))
              s.commit()
              for i in range(1, 18):
                  s.add(Exercise(id=i, external_id=f"e{i}", name_fa=f"حرکت {i}",
                                 name_en=f"ex {i}", muscle_group="legs",
                                 video_url=f"/static/exercises/{i}_0.jpg"))
              s.commit()
          print("seeded")
          EOF
          nohup python -m uvicorn app.main:create_app --factory --port 8000 \
            --host 127.0.0.1 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Install studio
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Live contract (studio TS client × real API)
        working-directory: mp-app/studio
        run: |
          TOKEN=$(cd ../backend && python -c "from app.security.jwt import create_access_token; print(create_access_token(1,'manager'))")
          MP_API_BASE=http://127.0.0.1:8000 MP_TOKEN="$TOKEN" npm test -- tests/liveContract.test.ts

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "mp-app/backend[dev]"
      - name: E2E مسیرهای حیاتی (ثبت‌نام→پرداخت→چک‌این + تأیید برنامه)
        run: |
          cd mp-app/backend
          pytest tests/integration -q
