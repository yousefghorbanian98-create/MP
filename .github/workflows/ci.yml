# Muscle Paradise — CI: lint → test → build → scan
name: mp-ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -e "mp-app/backend[dev]"
      - name: Lint (ruff)
        run: |
          cd mp-app/backend
          ruff check .
          ruff format --check .
      - name: Test (pytest + coverage ≥70%)
        run: |
          cd mp-app/backend
          pytest --cov=. --cov-report=xml --cov-fail-under=70
      - name: Security scan (bandit + pip-audit)
        run: |
          cd mp-app/backend
          bandit -r . -ll -q
          pip-audit

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mp-app/studio
        run: npm ci || npm install
      - name: Unit tests (Vitest) — شامل گیت‌های WCAG و sync توکن‌ها
        working-directory: mp-app/studio
        run: npm test
      - name: Build (Vite)
        working-directory: mp-app/studio
        run: npm run build
      - name: Audit (بدون بحرانی)
        working-directory: mp-app/studio
        run: |
          npm audit --audit-level=critical || true
          npm audit 2>&1 | tee audit.txt
          ! grep -q "Severity: critical" audit.txt

  client-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: mp-app/client
        run: flutter pub get
      - name: flutter analyze
        working-directory: mp-app/client
        run: flutter analyze
      - name: flutter test
        working-directory: mp-app/client
        run: flutter test

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "mp-app/backend[dev]"
      - name: E2E مسیرهای حیاتی (ثبت‌نام→پرداخت→چک‌این + تأیید برنامه)
        run: |
          cd mp-app/backend
          pytest tests/integration -q
