# M109 — پرداخت بدهیِ `dart format` (۶۵ فایل، شمارش‌شده در annotationِ `client-pinned`)
#
# چرا یک workflow و نه «دست در Codespace کاربر»:
#   agent sandbox نه `dart` دارد و نه می‌تواند Flutter را نصب کند (egress محدود)، و
#   ران کردن Codespace تو هم ممکن نیست: `POST /user/keys` با این credential «Resource not
#   accessible by integration» برمی‌گرداند، پس هیچ کلید SSH مجازی روی اکانت مجاز نمی‌شود و
#   `gh codespace ssh` نمی‌تواند وارد شود (ssh.dev.azure.com:22 هم از sandbox بسته است).
#   چیزی که این token **می‌تواند** dispatch کردنِ workflow و باز کردنِ PR است — پس فرمت
#   اینجا انجام می‌شود، ولی نه با commit مستقیم: خروجی یک PR است تا diff بازبینی شود.
#
# سه درسِ همین loop داخل گام‌ها نشسته است:
#   ۱) `git add -A` ممنوع — `flutter pub get`/`flutter test --coverage`/flutter خودش
#      فایل می‌سازند (pubspec.lock، coverage/lcov.info، بلوک analyzer.exclude در
#      analysis_options.yaml) و در commit «فقط فرمت» می‌نشینند.
#   2) اثبات باید روی **blobهای staged** باشد، نه روی کل درخت و نه پیش از گام‌های ابزار.
#   3) هر شکستی باید خودش را با `::error` گزارش کند: لاگ این job از API خوانده نمی‌شود.
name: client-format-fix (M109)

on:
  workflow_dispatch:
    inputs:
      fingerprint_scan:
        description: 'Print redacted Gitleaks fingerprints instead of formatting'
        type: boolean
        required: false
        default: false
      base_ref:
        description: 'Branch to format and open the PR against'
        required: true
        default: 'arena/4f336f66-mp'
  # bootstrap لازم است: GitHub یک workflow تازه را تنها پس از اولین اجرا (یا وقتی روی
  # default branch باشد) dispatch-پذیر می‌کند، و `main` این مخزن فقط README.md دارد —
  # `gh workflow run` با 404 جواب می‌داد. push به همین فایل، همان اولین اجرا را می‌دهد.
  push:
    paths:
      - '.github/workflows/client-format-fix.yml'

concurrency:
  group: client-format-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `metadata: read` عمداً اینجا نیست: آن یک کلیدِ مجازِ `permissions` نیست و GitHub با
  # دیدنش **کل فایل** را رد می‌کند — run 44349667465 با «failed to parse workflow:
  # (Line 43) Unexpected value 'metadata'» و صفر job تمام شد. access به متادیتا ضمنی است.

jobs:
  gitleaks-fingerprints:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fingerprint_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "  $archive$" gitleaks-checksums.txt | sha256sum --check)
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks gitleaks
      - name: Report only validated finding metadata
        run: |
          set +e
          /tmp/gitleaks/gitleaks git --redact --no-banner --log-level=error \
            --report-format=json --report-path=/tmp/gitleaks-report.json .
          scan_status=$?
          set -e
          SCAN_STATUS="$scan_status" python3 - <<'PYCODE'
          import json
          import os
          import re
          from pathlib import Path

          status = int(os.environ['SCAN_STATUS'])
          report = Path('/tmp/gitleaks-report.json')
          if status not in (0, 1) or not report.is_file():
              raise SystemExit('Scanner failed or report missing')
          findings = json.loads(report.read_text())
          if not isinstance(findings, list):
              raise SystemExit('Unexpected report format')
          print(f'Findings: {len(findings)}')
          for item in findings:
              rule, path, line, commit, fingerprint = (item.get(k) for k in
                  ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint'))
              # Restrict all output so malformed scanner data cannot inject commands
              # or leak unexpected fields such as Match, Secret, or source lines.
              if not (isinstance(rule, str) and re.fullmatch(r'[A-Za-z0-9_-]+', rule)
                      and isinstance(path, str) and re.fullmatch(r'[A-Za-z0-9_./-]+', path)
                      and isinstance(line, int) and line > 0
                      and isinstance(commit, str) and re.fullmatch(r'[0-9a-f]{40}', commit)
                      and isinstance(fingerprint, str)
                      and fingerprint == f'{commit}:{path}:{rule}:{line}'):
                  raise SystemExit('Invalid metadata; refusing to print')
              message = f'{rule} {path}:{line} {commit} {fingerprint}'
              print(message)
              print(f'::notice title=Gitleaks fingerprint::{message}')
          PYCODE

  format-client:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.fingerprint_scan }}
    name: dart format · proof it is layout-only · analyze + test · PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: ci/m109-dart-format
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref || github.sha }}
          fetch-depth: 0   # یک clone کم‌عمق می‌تواند push شاخهٔ تازه را رد کند

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"   # همان پینِ .devcontainer/Dockerfile — گام بعد چک می‌کند
          architecture: x64

      - name: Refuse to run if the SDK pin drifted from the devcontainer
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          dockerfile = pathlib.Path(".devcontainer/Dockerfile").read_text(encoding="utf-8")

          def arg(name):
              m = re.search(rf"^ARG\s+{name}=(\S+)\s*$", dockerfile, flags=re.M)
              if not m:
                  raise SystemExit(f"{name} missing from .devcontainer/Dockerfile")
              return m.group(1)

          want_v, want_r = arg("FLUTTER_VERSION"), arg("FLUTTER_REVISION")
          got = json.loads(subprocess.run(
              ["flutter", "--version", "--machine"], capture_output=True, text=True, check=True
          ).stdout)
          print(f"flutter here: {got.get('frameworkVersion')} ({got.get('frameworkRevision')})")
          print(f"devcontainer: {want_v} ({want_r})")
          # فرمت خروجی‌گراست: با SDKِ drift‌کرده، diff‌ای می‌سازیم که خودِ گیتِ repo ردش
          # می‌کند. بهتر است رد کنیم تا اینکه PR‌ای باز شود که CI بعداً قرمزش می‌کند.
          for field, want in (("frameworkVersion", want_v), ("frameworkRevision", want_r)):
              if got.get(field) != want:
                  raise SystemExit(f"refusing to format: {field} != devcontainer pin")
          PY

      # `flutter pub get` باید **پیش از** هر فراخوانی dart format اجرا شود: نسخهٔ زبانی
      # که formatter به آن فرمت می‌کند از `.dart_tool/package_config.json` (و در نهایت
      # `environment: sdk` در pubspec) خوانده می‌شود. بدون آن `dart format` با آخرین
      # نسخهٔ زبان کار می‌کند (= tall style)؛ با آن، این مخزن (`sdk: ">=3.3.0"`) short
      # style می‌خواهد. اولین اجرای M109 همین را ندانست و ۵۳ فایل را به سبکِ اشتباه
      # فرمت کرد — همان‌ها که گیتِ client-pinned روز بعد «unformatted» گزارش کرد.
      - name: flutter pub get (the formatter reads its language version from here)
        working-directory: mp-app/client
        run: flutter pub get > /dev/null

      - name: Count the debt before touching anything
        working-directory: mp-app/client
        run: |
          set -o pipefail
          mkdir -p /tmp/m109
          dart format --output=none --set-exit-if-changed lib test tools \
            > /tmp/m109/before.txt 2>&1 || true
          grep -c '^Changed' /tmp/m109/before.txt > /tmp/m109/before-count.txt || true
          printf 'unformatted before: %s\n' "$(cat /tmp/m109/before-count.txt 2>/dev/null || echo '?')" \
            | tee /tmp/m109/summary.txt

      - name: Format
        working-directory: mp-app/client
        run: |
          set -o pipefail
          dart format lib test tools 2>&1 | tail -3 | tee /tmp/m109/format.txt
          # «آیا کاری بود؟» باید به *.dart محدود شود: `flutter pub get` (گام ۴) خودش
          # analysis_options.yaml را دست‌کاری می‌کند، پس `git status` خالیِ کل درخت هیچ‌وقت
          # اتفاق نمی‌افتد و workflow روی درختِ تمیز هم تا «git commit» پیش می‌رفت و همان‌جا
          # با «nothing added to commit» می‌سوخت (run 44353087941؛ proof درست گفته بود
          # staged=0).
          if [ -z "$(git status --porcelain -- '*.dart')" ]; then
            echo "nothing to format — the debt is already paid here; no PR will be opened"
            echo "NO_CHANGES=1" >> "$GITHUB_ENV"
          fi

      - name: Idempotency (a second `dart format` must change nothing)
        working-directory: mp-app/client
        run: dart format --output=none --set-exit-if-changed lib test tools | tail -2

      - name: Behaviour must be unchanged (analyze + full test suite)
        working-directory: mp-app/client
        run: |
          set -o pipefail
          # pub get همین حالا اجرا شده؛ تکرارش فقط زمان می‌برد
          flutter analyze --no-fatal-infos
          flutter test --coverage --file-reporter=json:/tmp/m109/flutter-test.json \
            > /tmp/m109/flutter-test.txt 2>&1
          status=$?
          python3 tools/ci_test_failures.py --summary /tmp/m109/flutter-test.json | tee /tmp/m109/after.txt
          tail -2 /tmp/m109/flutter-test.txt || true
          exit "$status"

      - name: Stage only tracked .dart modifications
        if: env.NO_CHANGES != '1'
        run: |
          set -o pipefail
          git add -u -- '*.dart'
          staged=$(git diff --cached --name-status)
          bad=$(printf '%s\n' "$staged" | grep -v '^M[[:space:]].*\.dart$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=m109 staging::staged set is not layout-only: $(printf '%s' "$bad" | head -5 | tr '\n' '|')"
            exit 1
          fi
          printf 'staged files: %s\n' "$(printf '%s\n' "$staged" | grep -c .)" | tee /tmp/m109/staged.txt

      - name: Prove the staged diff changes nothing but layout
        if: env.NO_CHANGES != '1'
        run: |
          set -o pipefail
          python3 - <<'PY' | tee /tmp/m109/proof.txt
          import subprocess

          CLOSERS = set(")]}>")


          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout


          def notice(level, text):
              safe = text.replace("%", "%25").replace("\n", "%0A")
              print(f"::{level} title=m109 layout-proof::{safe}")


          def flat(text):
              return "".join(text.split())


          def classify(old, new):
              """'ws' | 'commas' | 'semantic' for a formatter-only diff.

              Whitespace differences are free. A comma is free only where the formatter is allowed
              to put or drop one — directly in front of a closing bracket, i.e. a trailing comma.
              That exception is deliberate and narrow: in Dart a comma is *not* always layout, since
              `(1)` and `(1,)` are different values (a record needs its comma), so a naive
              "ignore commas" comparison would wave through a real change.
              """
              a, b = flat(old), flat(new)
              if a == b:
                  return "ws", None
              i = j = 0
              layout_commas = True
              while i < len(a) and j < len(b):
                  if a[i] == b[j]:
                      i += 1
                      j += 1
                      continue
                  if b[j] == ",":                      # inserted by the formatter
                      k = j
                      while k < len(b) and b[k] == ",":
                          k += 1
                      if k >= len(b) or b[k] not in CLOSERS:
                          layout_commas = False
                      j = k
                      continue
                  if a[i] == ",":                      # dropped by the formatter
                      k = i
                      while k < len(a) and a[k] == ",":
                          k += 1
                      if k >= len(a) or a[k] not in CLOSERS:
                          layout_commas = False
                      i = k
                      continue
                  return "semantic", f"first difference at char {i}: old={a[i:i+40]!r} new={b[j:j+40]!r}"
              if i < len(a):
                  return "semantic", f"{len(a) - i} character(s) removed from the end"
              while j < len(b):
                  if b[j] != ",":
                      return "semantic", "content appended past the old end"
                  j += 1
              if not layout_commas:
                  return "semantic", "a comma appeared or vanished somewhere other than before a closing bracket"
              return "commas", None


          paths = [l for l in sh("git", "diff", "--cached", "--name-only").splitlines() if l.strip()]
          ws = commas = 0
          problems = []
          for path in paths:
              old = sh("git", "show", f"HEAD:{path}")   # committed content
              new = sh("git", "show", f":{path}")       # staged blob — what the commit will hold
              kind, why = classify(old, new)
              if kind == "ws":
                  ws += 1
              elif kind == "commas":
                  commas += 1
              else:
                  problems.append(f"{path}: {why}")

          print(f"staged={len(paths)} whitespace-only={ws} trailing-comma-layout={commas} rejected={len(problems)}")
          for text in problems[:6]:
              notice("warning", text)
          if problems:
              raise SystemExit(1)
          print("PASS: every staged change is whitespace, or a trailing comma beside a closing bracket")
          notice("notice", f"layout proof PASS — staged={len(paths)} whitespace-only={ws} trailing-comma-layout={commas}")
          PY

      - name: Commit and open the PR
        if: env.NO_CHANGES != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base_ref || github.ref_name }}
        run: |
          set -o pipefail
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "nothing staged — nothing to publish; no branch, no PR"
            exit 0
          fi
          git config user.name  "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          cat > /tmp/m109/commit.txt <<'MSG'
          Mechanical, layout-only reformat of the Flutter client (M109).

          `dart format lib test tools` on the SDK pinned by .devcontainer/Dockerfile. For
          the exact staged set the workflow proved: every file differs only in whitespace
          (or in trailing commas the formatter moved), a second `dart format` is a no-op,
          and `flutter analyze` plus the full `flutter test` suite pass. Untracked tool
          output (coverage/lcov.info, pubspec.lock) and the analyzer-exclusion block that
          flutter injects into analysis_options.yaml are deliberately NOT committed.

          After this merge the `dart format` step in ci.yml loses its `|| echo` and is fatal.
          MSG
          echo "" >> /tmp/m109/commit.txt
          echo "proof: $(grep -E '^staged=' /tmp/m109/proof.txt | tail -1)" >> /tmp/m109/commit.txt
          echo "tests: $(tail -1 /tmp/m109/after.txt 2>/dev/null)" >> /tmp/m109/commit.txt
          git commit -q -F /tmp/m109/commit.txt
          # $BRANCH شاخهٔ یک‌بارمصرفِ همین job است (همیشه از صفر ساخته می‌شود و خودش هرگز
          # merge نمی‌شود؛ فقط PR می‌شود). force یعنی «بازسازیِ deterministic» و هرگز روی
          # arena/… یا main اعمال نمی‌شود.
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo "## M109 — \`dart format\` on \`mp-app/client\` (\`lib\`, \`test\`, \`tools\`)"
            echo
            echo '```text'
            cat /tmp/m109/summary.txt /tmp/m109/staged.txt /tmp/m109/proof.txt /tmp/m109/format.txt /tmp/m109/after.txt 2>/dev/null || true
            echo '```'
            echo
            echo "- generated by \`${GITHUB_WORKFLOW}\` on \`${{ github.sha }}\` (run \`${{ github.run_id }}\`); nothing is committed to \`${BASE}\` directly."
            echo "- the proof compares **staged blobs**, so tool output and flutter's own \`analysis_options.yaml\` injection cannot ride along."
          } > /tmp/m109/body.md
          # stderr هم به‌صورت annotation نوشته می‌شود؛ لاگ این job از API خوانده نمی‌شود
          # (REGRESSIONS R-036) و بدون آن تنها شاهدِ شکست «exit code 1» است.
          # PR از راه REST ساخته می‌شود، نه `gh pr create`: آن فرمان پیش از ساختن،
          # چند فراخوانی متادیتا/کاربر می‌زند که با job token مجاز نیستند (در run
          # 44348498677 دقیقاً همان گام، پس از موفق‌شدنِ push، با «exit code 1» مرد و
          # چیزی جز آن نشانه نگذاشت). `POST /pulls` تنها `pull-requests: write` می‌خواهد.
          # stderr به‌عنوان annotation منتشر می‌شود: لاگ jobهای این مخزن از API خالی است (R-036).
          # سیاست مخزن «Allow GitHub Actions to create and approve pull requests» خاموش است
          # و POST /pulls با job token 403 می‌دهد («GitHub Actions is not permitted to create or
          # approve pull requests» — run 44352142959). آن را باز نمی‌کنیم: PR را انسانی/ایجنتی
          # باز می‌کند که token شخصیش این اجازه را دارد، و گام عمداً **فیل نمی‌شود** — شاخه و
          # شواهدش سودمندند حتی وقتی PR ساخته نمی‌شود.
          if gh api -X POST "repos/${{ github.repository }}/pulls" \
              -f title="style(client): dart format lib test tools (M109)" \
              -f head="$BRANCH" -f base="$BASE" -f body="$(cat /tmp/m109/body.md)" \
              --jq .html_url > /tmp/m109/pr.url 2>/tmp/m109/pr.err; then
            echo "::notice title=m109 pr::$(cat /tmp/m109/pr.url)"
          else
            err=$(tr '\n' ' ' < /tmp/m109/pr.err | cut -c1-200 | tr '%' '#')
            echo "::warning title=m109 pr::PR not opened (${err}). Branch $BRANCH is pushed with the layout-only commit — open the PR yourself: gh pr create --base $BASE --head $BRANCH"
            echo "PR_URL=none" >> "$GITHUB_ENV"
          fi
