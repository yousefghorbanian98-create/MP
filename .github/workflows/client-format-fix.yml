# M109 — پرداخت بدهیِ `dart format` (۶۵ فایل، شمارش از annotationِ `client-pinned`)
#
# چرا یک workflow و نه «دست در Codespace کاربر»:
#   agent sandbox نه `dart` دارد و نه می‌تواند Flutter را نصب کند (egress محدود)، و
#   ران کردن Codespace تو هم ممکن نیست: `POST /user/keys` با این credential «Resource not
#   accessible by integration» برمی‌گرداند، پس هیچ کلید SSH مجازی روی اکانت نمی‌نشیند و
#   `gh codespace ssh` نمی‌تواند وارد شود. چیزی که این token **می‌تواند** dispatch کردنِ
#   workflow و باز کردنِ PR است — پس فرمت اینجا انجام می‌شود، ولی **نه** با commit مستقیم:
#   خروجی یک PR است تا یک نفر (ایجنتم، با بازخوانی diff) آن را ببیند.
#
# تضمین «فقط فرمت»: برای هر فایل، تمامِ whitespace دو نسخه حذف و بایت‌به‌بایت مقایسه
# می‌شود؛ اگر حتی یک token عوض شده باشد job فیل می‌شود. به‌علاوه idempotency
# (`dart format` دوباره نباید چیزی عوض کند) و رفتار (`analyze` + `test --coverage`).
#
# فقط `workflow_dispatch`. هیچ keystore، هیچ secret، هیچ artifact قابل‌انتشار.
name: client-format-fix (M109)

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Branch to format and open the PR against'
        required: true
        default: 'arena/4f336f66-mp'
  # bootstrap لازم است: GitHub یک workflow تازه‌ را فقط پس از اولین اجرا (یا وقتی روی
  # default branch باشد) dispatch-پذیر می‌کند — `main` این مخزن فقط README.md دارد، پس
  # `gh workflow run` با 404 جواب می‌داد. یک push به همین فایل، همان یک بار اجرا را
  # از مسیر push شروع می‌کند و از آن به بعد dispatch کار می‌کند.
  push:
    paths:
      - '.github/workflows/client-format-fix.yml'

concurrency:
  group: client-format-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  format-client:
    name: dart format · proof it is whitespace-only · analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: ci/m109-dart-format
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref || github.sha }}
          fetch-depth: 0   # a shallow clone can make the branch push fail on some servers

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"   # همان پینِ .devcontainer/Dockerfile — چک پایین
          architecture: x64

      - name: Refuse to run if the SDK pin drifted from the devcontainer
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          dockerfile = pathlib.Path(".devcontainer/Dockerfile").read_text(encoding="utf-8")

          def arg(name):
              m = re.search(rf"^ARG\s+{name}=(\S+)\s*$", dockerfile, flags=re.M)
              if not m:
                  raise SystemExit(f"{name} missing from .devcontainer/Dockerfile")
              return m.group(1)

          want_v, want_r = arg("FLUTTER_VERSION"), arg("FLUTTER_REVISION")
          got = json.loads(subprocess.run(
              ["flutter", "--version", "--machine"], capture_output=True, text=True, check=True
          ).stdout)
          print(f"flutter here: {got.get('frameworkVersion')} ({got.get('frameworkRevision')})")
          print(f"devcontainer: {want_v} ({want_r})")
          # Formatting is version-sensitive: a drifted SDK would produce a diff the repo's
          # own gate rejects. Better to refuse than to open a PR that CI then fails.
          for field, want in (("frameworkVersion", want_v), ("frameworkRevision", want_r)):
              if got.get(field) != want:
                  raise SystemExit(f"refusing to format: {field} != devcontainer pin")
          PY

      - name: Count the debt before touching anything
        working-directory: mp-app/client
        run: |
          set -o pipefail
          mkdir -p /tmp/m109
          dart format --output=none --set-exit-if-changed lib test tools \
            > /tmp/m109/before.txt 2>&1 || true
          grep -c '^Changed' /tmp/m109/before.txt > /tmp/m109/before-count.txt || true
          echo "unformatted before: $(cat /tmp/m109/before-count.txt)" | tee /tmp/m109/summary.txt

      - name: Format
        working-directory: mp-app/client
        run: |
          set -o pipefail
          dart format lib test tools 2>&1 | tail -3 | tee /tmp/m109/format.txt
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to format — the debt is already paid here; no PR will be opened"
            echo "NO_CHANGES=1" >> "$GITHUB_ENV"
            exit 0
          fi


      - name: Idempotency (a second `dart format` must change nothing)
        if: env.NO_CHANGES != '1'
        working-directory: mp-app/client
        run: dart format --output=none --set-exit-if-changed lib test tools | tail -2

      - name: Behaviour must be unchanged (analyze + full test suite)
        if: env.NO_CHANGES != '1'
        working-directory: mp-app/client
        run: |
          set -o pipefail
          flutter pub get > /dev/null
          flutter analyze --no-fatal-infos
          flutter test --coverage --file-reporter=json:/tmp/m109/flutter-test.json \
            > /tmp/m109/flutter-test.txt 2>&1
          status=$?
          python3 tools/ci_test_failures.py --summary /tmp/m109/flutter-test.json | tee /tmp/m109/after.txt
          tail -2 /tmp/m109/flutter-test.txt || true
          exit "$status"

      # ── دو گام آخر روی «چیزی که واقعاً commit می‌شود» قضاوت می‌کنند، نه روی کل درخت:
      # اولین اجرای این workflow با `git add -A` سه فایل بی‌ربط را داخل commitِ «فقط فرمت»
      # کشید — coverage/lcov.info و pubspec.lock (خروجی `flutter test --coverage` و
      # `pub get`) و بلوک analyzer.exclude که خودِ `flutter` در analysis_options.yaml
      # تزریق می‌کند. یک commit مکانیکی باید مکانیکی بماند، پس اینجا فقط .dartهای tracked
      # stage می‌شوند و اثبات روی خودِ blobهای staged انجام می‌شود.
      - name: Stage only tracked .dart modifications
        if: env.NO_CHANGES != '1'
        run: |
          set -o pipefail
          git add -u -- '*.dart'
          staged=$(git diff --cached --name-status)
          bad=$(printf '%s\n' "$staged" | grep -v '^M[[:space:]].*\.dart$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=m109 staging::staged set is not layout-only: $(printf '%s' "$bad" | head -5 | tr '\n' '|')"
            exit 1
          fi
          printf 'staged files: %s\n' "$(printf '%s\n' "$staged" | grep -c .)" | tee /tmp/m109/staged.txt

      - name: Prove the staged diff changes nothing but layout
        if: env.NO_CHANGES != '1'
        run: |
          set -o pipefail
          python3 - <<'PY' | tee /tmp/m109/proof.txt
          import subprocess

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout

          def notice(level, text):
              # job logs of this repo are not readable through the API, so the diagnosis has
              # to travel as an annotation — see .finn/state/REGRESSIONS.md R-036
              safe = text.replace("%", "%25").replace("\n", "%0A")
              print(f"::{level} title=m109 layout-proof::{safe}")

          def flat(s):
              return "".join(s.split())

          paths = [l for l in run("git", "diff", "--cached", "--name-only").splitlines() if l.strip()]
          layout, commas, problems = [], [], []
          for path in paths:
              old = run("git", "show", f"HEAD:{path}")   # committed content
              new = run("git", "show", f":{path}")       # staged blob — what the commit will hold
              if flat(old) == flat(new):
                  layout.append(path)
              elif flat(old).replace(",", "") == flat(new).replace(",", ""):
                  # the tall-style formatter moves trailing commas when it splits an argument
                  # list; a comma there is only a separator, so this is still layout — counted
                  # apart so it can never hide inside the whitespace claim
                  commas.append(path)
              else:
                  a, b = flat(old), flat(new)
                  at = next((k for k in range(min(len(a), len(b))) if a[k] != b[k]), min(len(a), len(b)))
                  problems.append(f"{path}: content change at char {at} "
                                  f"old={a[max(0, at - 40):at + 40]!r} new={b[max(0, at - 40):at + 40]!r}")

          print(f"staged={len(paths)} whitespace-only={len(layout)} comma-moved={len(commas)} rejected={len(problems)}")
          for text in problems[:6]:
              notice("warning", text)
          if problems:
              raise SystemExit(1)
          print("PASS: every staged change is layout (whitespace, or commas the formatter moved)")
          notice("notice", f"layout proof PASS — staged={len(paths)} whitespace-only={len(layout)} "
                           f"comma-moved={len(commas)}")
          PY

      - name: Commit and open the PR
        if: env.NO_CHANGES != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base_ref || github.ref_name }}
        run: |
          set -o pipefail
          git config user.name  "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          cat > /tmp/m109/commit.txt <<'MSG'
          Mechanical, layout-only reformat of the Flutter client (M109).

          `dart format lib test tools` on the SDK pinned by .devcontainer/Dockerfile. For
          the exact staged set the workflow proved: every file differs only in whitespace
          (or in trailing commas the formatter moved), a second `dart format` is a no-op,
          and `flutter analyze` plus the full `flutter test` suite pass. Untracked tool
          output (coverage/lcov.info, pubspec.lock) and the analyzer-exclusion block that
          flutter injects into analysis_options.yaml are deliberately NOT committed.

          After this merge the `dart format` step in ci.yml loses its `|| echo` and is fatal.
          MSG
          echo "" >> /tmp/m109/commit.txt
          echo "proof: $(grep -E '^staged=' /tmp/m109/proof.txt | tail -1)" >> /tmp/m109/commit.txt
          echo "tests: $(tail -1 /tmp/m109/after.txt 2>/dev/null)" >> /tmp/m109/commit.txt
          git commit -q -F /tmp/m109/commit.txt
          git push -q origin "HEAD:refs/heads/$BRANCH"
          {
            echo "## M109 — \`dart format\` on \`mp-app/client\` (\`lib\`, \`test\`, \`tools\`)"
            echo
            echo '```text'
            cat /tmp/m109/summary.txt /tmp/m109/staged.txt /tmp/m109/proof.txt /tmp/m109/format.txt /tmp/m109/after.txt 2>/dev/null || true
            echo '```'
            echo
            echo "- generated by \`${GITHUB_WORKFLOW}\` on \`${{ github.sha }}\` (run \`${{ github.run_id }}\`); nothing is committed to \`${BASE}\` directly."
            echo "- the proof compares **staged blobs**, so tool output and flutter's own \`analysis_options.yaml\` injection cannot ride along."
          } > /tmp/m109/body.md
          gh pr create --base "$BASE" --head "$BRANCH" --title "style(client): dart format lib test tools (M109)" --body-file /tmp/m109/body.md
